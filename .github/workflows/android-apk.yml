name: Crea APK laboratorio

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configura Android SDK
        uses: android-actions/setup-android@v3
      - name: Configura Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Installa SDK Android richiesto
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Compila APK di prova
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Pubblica APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Cover-Lab-AI-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
