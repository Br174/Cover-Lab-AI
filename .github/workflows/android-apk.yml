name: UAB - Crea APK e ZIP Cover Lab AI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'lab/**'
      - 'candidate/**'
      - 'mother/**'
    paths:
      - 'android/**'
      - 'UAB_PROJECT_ADAPTER.txt'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Precontrollo UAB
        run: |
          test -f UAB_PROJECT_ADAPTER.txt
          grep -q '^UAB_ENGINE_VERSION=UAB-CORE-V1.1$' UAB_PROJECT_ADAPTER.txt
          grep -q '^UAB_PROJECT_NAME=Cover Lab AI$' UAB_PROJECT_ADAPTER.txt
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      - name: Configura Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle 9.6 e cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-cleanup: on-success

      - name: Verifica SDK Android del server
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Installa piattaforma Android richiesta
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Compila APK LAB con cache UAB
        working-directory: android
        run: gradle --no-daemon --build-cache :app:assembleDebug

      - name: Verifica pacchetto e prepara artefatti UAB
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/coverlab-badging.txt
          grep -q "package: name='it.coverlab.ai.lab'" /tmp/coverlab-badging.txt

          mkdir -p dist/uab
          cp "$APK" dist/uab/Cover-Lab-AI-LAB.apk
          zip -j dist/uab/Cover-Lab-AI-LAB.zip dist/uab/Cover-Lab-AI-LAB.apk
          unzip -t dist/uab/Cover-Lab-AI-LAB.zip
          test "$(unzip -Z1 dist/uab/Cover-Lab-AI-LAB.zip)" = "Cover-Lab-AI-LAB.apk"

          (
            cd dist/uab
            sha256sum Cover-Lab-AI-LAB.apk Cover-Lab-AI-LAB.zip > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          cat > dist/uab/uab-manifest.json <<EOF
          {
            "motore": "UAB-CORE-V1.1",
            "progetto": "Cover Lab AI",
            "repository": "${GITHUB_REPOSITORY}",
            "ramo": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "pacchetto": "it.coverlab.ai.lab",
            "tipo": "LAB",
            "run": "${GITHUB_RUN_ID}"
          }
          EOF

          test -s dist/uab/Cover-Lab-AI-LAB.apk
          test -s dist/uab/Cover-Lab-AI-LAB.zip
          test -s dist/uab/SHA256SUMS.txt
          test -s dist/uab/uab-manifest.json

      - name: Pubblica artefatti temporanei UAB
        uses: actions/upload-artifact@v4
        with:
          name: Cover-Lab-AI-UAB-${{ github.run_number }}
          path: dist/uab/**
          if-no-files-found: error
          retention-days: 14
