name: LAB temporanea - Archivio Vivo remoto

on:
  push:
    branches:
      - 'lab/uab-onboarding-01'
    paths:
      - '.github/workflows/lab-archivio-vivo-remoto.yml'

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Migra D1, verifica semi e prova un giro
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lab-uab-onboarding-01-cover-lab-ai.brunoverlezza.workers.dev"

          echo "Attendo endpoint LAB temporaneo..."
          PRONTO=0
          for TENTATIVO in $(seq 1 30); do
            CODICE=$(curl --silent --show-error --max-time 10 -o /tmp/migra.json -w '%{http_code}' "$BASE/__lab-archivio-vivo-migra" || true)
            if [ "$CODICE" = "200" ]; then
              PRONTO=1
              break
            fi
            echo "Tentativo $TENTATIVO: HTTP $CODICE"
            sleep 4
          done
          test "$PRONTO" = "1"
          echo "--- MIGRAZIONE ---"
          cat /tmp/migra.json
          echo

          python - <<'PY'
          import json
          d=json.load(open('/tmp/migra.json',encoding='utf-8'))
          assert d.get('stato') == 'ok', d
          assert set(d.get('tabelle') or []) == {
              'coda_archivio_vivo','scansioni_archivio_vivo','configurazione_archivio_vivo'
          }, d
          assert int(d.get('semiItaliani') or 0) == 10, d
          assert int(d.get('vociCoda') or 0) >= 10, d
          print('Migrazione remota verificata. Voci coda:', d.get('vociCoda'))
          PY

          echo "--- STATO PRIMA DEL GIRO ---"
          curl --fail --silent --show-error --max-time 15 "$BASE/__lab-archivio-vivo-stato" -o /tmp/prima.json
          cat /tmp/prima.json
          echo

          echo "--- GIRO ARCHIVIO VIVO ---"
          CODICE_GIRO=$(curl --silent --show-error --max-time 100 -o /tmp/giro.json -w '%{http_code}' "$BASE/__lab-archivio-vivo-giro")
          echo "HTTP giro: $CODICE_GIRO"
          cat /tmp/giro.json
          echo
          test "$CODICE_GIRO" = "200"

          python - <<'PY'
          import json
          d=json.load(open('/tmp/giro.json',encoding='utf-8'))
          assert d.get('stato') == 'ok', d
          assert int(d.get('elaborate') or 0) == 1, d
          print('Giro remoto completato:', d.get('esiti'))
          PY

          echo "--- STATO DOPO IL GIRO ---"
          curl --fail --silent --show-error --max-time 15 "$BASE/__lab-archivio-vivo-stato" -o /tmp/dopo.json
          cat /tmp/dopo.json
          echo

          python - <<'PY'
          import json
          d=json.load(open('/tmp/dopo.json',encoding='utf-8'))
          assert d.get('stato') == 'ok', d
          coda=d.get('coda') or []
          scansioni=d.get('scansioni') or []
          assert len(coda) >= 10, len(coda)
          assert len(scansioni) >= 1, scansioni
          print('Coda verificata:', len(coda), 'voci mostrate; scansioni:', len(scansioni))
          PY
