name: LAB 0.8 - Diagnosi candidati

on:
  workflow_dispatch:
  push:
    branches:
      - 'lab/archive-diagnostics-080'
    paths:
      - '.github/workflows/lab-diagnosi-candidati-080.yml'

jobs:
  diagnosi:
    runs-on: ubuntu-latest
    steps:
      - name: Leggi candidati e prova Wikidata
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lab-archive-diagnostics-080-cover-lab-ai.brunoverlezza.workers.dev"
          sleep 30

          echo "--- DIAGNOSTICA LAB ---"
          curl --silent --show-error --max-time 40 \
            "$BASE/api/diagnostica?titolo=Sapore%20di%20sale&artista=Gino%20Paoli" \
            -o /tmp/diag.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/diag.json',encoding='utf-8'))
          print('ARCHIVIO',d.get('archivio'))
          print('STATI CANDIDATI',d.get('statiCandidati'))
          print('FONTI',d.get('fonti'))
          print('SALUTE',d.get('saluteProvider'))
          print('\nULTIME TRACCE REGISTA')
          for t in (d.get('registaAI') or {}).get('tracce') or []:
              print(json.dumps(t,ensure_ascii=False))
          print('\nULTIME STRATEGIE')
          for s in (d.get('strategie') or [])[:35]:
              print(json.dumps(s,ensure_ascii=False))
          print('\nPROVE CANDIDATI/ARCHIVIO')
          for p in d.get('prove') or []:
              print(json.dumps(p,ensure_ascii=False))
          PY

          echo "--- PROVA WIKIDATA API + SPARQL ---"
          python - <<'PY'
          import json, urllib.parse, urllib.request
          UA='CoverLabAI/0.8.0 (https://github.com/Br174/Cover-Lab-AI)'
          def get_json(url, params=None, accept='application/json'):
              if params:
                  url += ('&' if '?' in url else '?') + urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              with urllib.request.urlopen(req,timeout=40) as r:
                  return r.status, json.load(r)

          status, search=get_json('https://www.wikidata.org/w/api.php',{
              'action':'wbsearchentities','search':'Sapore di sale','language':'it','uselang':'it','type':'item','limit':20,'format':'json'
          })
          print('HTTP search',status)
          for x in search.get('search',[]):
              print('SEARCH',x.get('id'),x.get('label'),x.get('description'))
          exact=[x for x in search.get('search',[]) if (x.get('label') or '').casefold()=='sapore di sale']
          if not exact:
              raise SystemExit('Nessun item Wikidata esatto per Sapore di sale')
          qid=exact[0]['id']
          print('QID scelto',qid)
          query=f'''SELECT ?version ?versionLabel ?performer ?performerLabel ?date ?rel WHERE {{
            {{ ?version wdt:P5059 wd:{qid} . BIND("modified version of" AS ?rel) }}
            UNION
            {{ ?version wdt:P144 wd:{qid} . BIND("based on" AS ?rel) }}
            OPTIONAL {{ ?version wdt:P175 ?performer . }}
            OPTIONAL {{ ?version wdt:P577 ?date . }}
            SERVICE wikibase:label {{ bd:serviceParam wikibase:language "it,en". }}
          }} LIMIT 100'''
          status, data=get_json('https://query.wikidata.org/sparql',{'query':query,'format':'json'},'application/sparql-results+json')
          rows=data.get('results',{}).get('bindings',[])
          print('HTTP SPARQL',status,'righe',len(rows))
          for r in rows:
              print('ROW', {k:v.get('value') for k,v in r.items()})
          PY
