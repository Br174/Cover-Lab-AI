name: LAB 0.8 - Diagnosi candidati

on:
  workflow_dispatch:
  push:
    branches:
      - 'lab/archive-diagnostics-080'
    paths:
      - '.github/workflows/lab-diagnosi-candidati-080.yml'

jobs:
  diagnosi:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnosi sola lettura Sapore di sale e Ancora
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lab-archive-diagnostics-080-cover-lab-ai.brunoverlezza.workers.dev"
          sleep 20

          echo "--- DIAGNOSTICA SAPORE DI SALE ---"
          curl --silent --show-error --max-time 40 \
            "$BASE/api/diagnostica?titolo=Sapore%20di%20sale&artista=Gino%20Paoli" -o /tmp/diag.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/diag.json',encoding='utf-8'))
          print('ARCHIVIO',d.get('archivio'))
          print('STATI CANDIDATI',d.get('statiCandidati'))
          print('FONTI',d.get('fonti'))
          print('ULTIMO REGISTA',((d.get('registaAI') or {}).get('tracce') or [None])[0])
          PY

          echo "--- ARCHIVIO ANCORA: SOLA LETTURA ---"
          curl --silent --show-error --max-time 40 \
            "$BASE/api/versioni?titolo=Ancora&artista=Eduardo%20De%20Crescenzo&ordine=asc" -o /tmp/ancora-versioni.json
          curl --silent --show-error --max-time 40 \
            "$BASE/api/diagnostica?titolo=Ancora&artista=Eduardo%20De%20Crescenzo" -o /tmp/ancora-diag.json
          python - <<'PY'
          import json
          v=json.load(open('/tmp/ancora-versioni.json',encoding='utf-8'))
          d=json.load(open('/tmp/ancora-diag.json',encoding='utf-8'))
          print('VERSIONI ANCORA')
          for x in v.get('versioni') or []:
            print({k:x.get(k) for k in ('id','titolo','interprete','anno','tipo','affidabilita','idMusicBrainz','statoVerifica','statoArchivio','motivoArchivio')})
          print('PROVE SOSPETTE')
          for p in d.get('prove') or []:
            t=' '.join(str(p.get(k) or '') for k in ('interprete','titolo','titoloFonte','fonte','indirizzo'))
            if 'Migliacci' in t or 'Mattone' in t:
              print(p)
          print('FONTI ANCORA',d.get('fonti'))
          print('STATI ANCORA',d.get('statiCandidati'))
          PY

          echo "--- MEDIAWIKI ACTION API ---"
          python - <<'PY'
          import json, urllib.parse, urllib.request, re
          UA='CoverLabAI/0.8.0 (https://github.com/Br174/Cover-Lab-AI)'
          params={
            'action':'parse','page':'Sapore di sale','prop':'sections|wikitext',
            'format':'json','formatversion':'2','maxlag':'5'
          }
          url='https://it.wikipedia.org/w/api.php?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=40) as r:
            print('HTTP',r.status)
            d=json.load(r)
          p=d.get('parse') or {}
          print('TITLE',p.get('title'))
          print('SECTIONS')
          for s in p.get('sections') or []:
            print(s.get('index'),repr(s.get('line')),s.get('level'))
          wt=p.get('wikitext') or ''
          print('WIKITEXT_LEN',len(wt))
          m=re.search(r'(?ims)^==+\s*(?:Cover|Versioni(?:\s+e\s+adattamenti)?|Reprises?|Versions?\s+et\s+adaptations?)\s*==+\s*(.*?)(?=^==+[^=]|\Z)',wt)
          if m:
            print('SEZIONE_COVER')
            print(m.group(1)[:10000])
          else:
            print('SEZIONE_COVER_NON_TROVATA')
          PY
