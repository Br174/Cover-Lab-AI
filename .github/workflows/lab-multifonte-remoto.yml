name: LAB - Collaudo remoto Cover Lab AI

on:
  push:
    branches:
      - 'lab/uab-onboarding-01'
    paths:
      - '.github/workflows/lab-multifonte-remoto.yml'

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica anteprima Cloudflare e ricerca libera
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lab-uab-onboarding-01-cover-lab-ai.brunoverlezza.workers.dev"

          echo "Attendo la LAB Cover Lab AI 0.7.0..."
          PRONTO=0
          for TENTATIVO in $(seq 1 60); do
            CODICE_STATO=$(curl --silent --show-error --max-time 12 -o /tmp/root.json -w '%{http_code}' "$BASE/" || true)
            if [ "$CODICE_STATO" = "200" ] && grep -q '"versione": "0.7.0"' /tmp/root.json; then
              PRONTO=1
              break
            fi
            echo "Tentativo $TENTATIVO: anteprima non ancora 0.7.0 (HTTP $CODICE_STATO)"
            sleep 4
          done
          test "$PRONTO" = "1"

          echo "--- STATO MOTORE REMOTO ---"
          cat /tmp/root.json
          echo
          python - <<'PY'
          import json
          d=json.load(open('/tmp/root.json',encoding='utf-8'))
          assert d.get('versione') == '0.7.0', d
          assert d.get('stato') == 'operativo', d
          assert d.get('ricercaLiberaDiagnostica') == 'predisposta', d
          assert d.get('autocontrolloRisultati') == 'predisposto', d
          assert d.get('nessunLimiteTotaleCover') is True, d
          assert d.get('lottoMusicLab') == 20, d
          regista=d.get('registaAI') or {}
          assert regista, d
          print('OK: motore LAB 0.7.0 raggiungibile e funzioni principali esposte.')
          PY

          echo "--- ARCHIVIO REMOTO: PRIMA PAGINA DA 20 ---"
          CODICE_PAGINA=$(curl --silent --show-error --max-time 20 -o /tmp/pagina.json -w '%{http_code}' \
            "$BASE/api/versioni?titolo=Nel%20blu%20dipinto%20di%20blu&artista=Domenico%20Modugno&ordine=asc&offset=0" || true)
          echo "HTTP archivio: $CODICE_PAGINA"
          cat /tmp/pagina.json || true
          echo
          test "$CODICE_PAGINA" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pagina.json',encoding='utf-8'))
          versioni=d.get('versioni') or []
          assert len(versioni) <= 20, len(versioni)
          assert 'totale' in d, d
          print('OK: paginazione Music Lab massimo 20 per pagina. Totale archivio:', d.get('totale'))
          PY

          echo "--- RICERCA LIBERA DIAGNOSTICA ---"
          CODICE_RICERCA=$(curl --silent --show-error --max-time 60 -o /tmp/ricerca.json -w '%{http_code}' \
            -X POST "$BASE/api/ricerca-libera" \
            -H 'Content-Type: application/json' \
            --data '{"query":"Gino Paoli, Sapore di sale","ordine":"asc"}' || true)
          echo "HTTP ricerca libera: $CODICE_RICERCA"
          cat /tmp/ricerca.json || true
          echo
          test "$CODICE_RICERCA" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ricerca.json',encoding='utf-8'))
          assert d.get('stato') in ('pronto','ricerca_incompleta'), d
          rl=d.get('ricercaLibera') or {}
          interpretazione=rl.get('interpretazione') or {}
          assert interpretazione.get('titolo'), interpretazione
          assert interpretazione.get('artista'), interpretazione
          assert isinstance(d.get('versioni') or [], list), d
          assert 'autocontrollo' in d, d
          print('OK: barra libera -> identificazione composizione -> motore Cover Lab.')
          print('Composizione interpretata:', interpretazione.get('artista'), '-', interpretazione.get('titolo'))
          print('Versioni nella risposta:', len(d.get('versioni') or []))
          PY

          echo "COLLAUDO REMOTO LAB COMPLETATO."
