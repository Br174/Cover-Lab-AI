name: LAB 0.8 - Collaudo remoto Cover Lab AI

on:
  push:
    branches:
      - 'lab/archive-diagnostics-080'
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - '.github/workflows/lab-multifonte-remoto.yml'

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica LAB 0.8 Archivio Cloud diagnostica e Sapore di sale
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lab-archive-diagnostics-080-cover-lab-ai.brunoverlezza.workers.dev"

          echo "Collaudo finale LAB 0.8.0: attendo il deploy Cloudflare della revisione corrente..."
          sleep 30
          PRONTO=0
          for TENTATIVO in $(seq 1 120); do
            CODICE=$(curl --silent --show-error --max-time 15 -o /tmp/root.json -w '%{http_code}' "$BASE/" || true)
            if [ "$CODICE" = "200" ] \
              && grep -q '"versione": "0.8.0"' /tmp/root.json \
              && grep -q '"diagnosticaMotore": "predisposta"' /tmp/root.json \
              && grep -q '"archivioCloud": "/archivio"' /tmp/root.json; then
              PRONTO=1
              break
            fi
            echo "Tentativo $TENTATIVO: preview 0.8.0 non ancora pronta (HTTP $CODICE)"
            sleep 5
          done
          test "$PRONTO" = "1"

          python - <<'PY'
          import json
          d=json.load(open('/tmp/root.json',encoding='utf-8'))
          assert d.get('versione') == '0.8.0', d
          assert d.get('stato') == 'operativo', d
          assert d.get('archivioCloud') == '/archivio', d
          assert d.get('diagnosticaMotore') == 'predisposta', d
          assert d.get('nessunLimiteTotaleCover') is True, d
          assert d.get('lottoMusicLab') == 20, d
          regola=d.get('archivioCertificato') or {}
          assert regola.get('regola') == 'relazione_verificata_e_crediti_essenziali', regola
          print('OK: motore 0.8.0 e regola Archivio certificato esposti.')
          PY

          echo "--- PAGINA ARCHIVIO CLOUD ---"
          CODICE_HTML=$(curl --silent --show-error --max-time 20 -o /tmp/archivio.html -w '%{http_code}' "$BASE/archivio" || true)
          echo "HTTP pagina Archivio: $CODICE_HTML"
          test "$CODICE_HTML" = "200"
          grep -q 'Archivio Cover Lab' /tmp/archivio.html
          grep -q 'Cerca titolo, artista, adattamento' /tmp/archivio.html

          echo "--- STATISTICHE ARCHIVIO ---"
          CODICE_STATS=$(curl --silent --show-error --max-time 20 -o /tmp/stats.json -w '%{http_code}' "$BASE/api/archivio/statistiche" || true)
          echo "HTTP statistiche: $CODICE_STATS"
          cat /tmp/stats.json || true
          echo
          test "$CODICE_STATS" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/stats.json',encoding='utf-8'))
          assert d.get('stato') == 'pronto', d
          for k in ('braniPresenti','versioniArchiviate','nuoveUltimoAggiornamento'):
              assert isinstance(d.get(k), int), (k,d)
          print('Archivio:', d.get('braniPresenti'), 'brani /', d.get('versioniArchiviate'), 'versioni certificate')
          PY

          echo "--- RICERCA ARCHIVIO MIRATA ---"
          CODICE_AC=$(curl --silent --show-error --max-time 20 -o /tmp/ac.json -w '%{http_code}' \
            "$BASE/api/archivio/cerca?q=nel%20blu%20dipinto%20di%20blu" || true)
          echo "HTTP ricerca Archivio: $CODICE_AC"
          cat /tmp/ac.json || true
          echo
          test "$CODICE_AC" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ac.json',encoding='utf-8'))
          assert d.get('stato') == 'pronto', d
          assert isinstance(d.get('risultati'), list), d
          print('Risultati ricerca Archivio:', len(d.get('risultati') or []))
          PY

          echo "--- RICERCA ESATTA GINO PAOLI / SAPORE DI SALE ---"
          CODICE_GINO=$(curl --silent --show-error --max-time 110 -o /tmp/gino.json -w '%{http_code}' \
            -X POST "$BASE/api/ricerca-libera" \
            -H 'Content-Type: application/json' \
            --data '{"query":"gino paoli sapore di sale","ordine":"asc"}' || true)
          echo "HTTP Gino Paoli: $CODICE_GINO"
          cat /tmp/gino.json || true
          echo
          test "$CODICE_GINO" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/gino.json',encoding='utf-8'))
          assert d.get('stato') == 'pronto', d
          i=((d.get('ricercaLibera') or {}).get('interpretazione') or {})
          assert 'sapore di sale' in (i.get('titolo') or '').lower(), i
          assert 'gino paoli' in (i.get('artista') or '').lower(), i
          comp=d.get('composizione') or {}
          c=comp.get('crediti') or []
          assert len(c) > 0, comp
          versioni=d.get('versioni') or []
          assert len(versioni) >= 2, ('troppo pochi risultati per il collaudo',len(versioni),d)
          ess={'compositore','paroliere','autore','traduttore','adattatore','arrangiatore'}
          ricchi=0
          for v in versioni:
              assert v.get('provenienzaRisultato') in ('archivio','ricerca'), v
              cred=v.get('crediti') or []
              if any(str(x.get('ruolo','')).lower() in ess for x in cred): ricchi+=1
              assert v.get('naturaVersione') in ('incisione_pubblicata','performance_registrata','da_classificare'), v
          assert ricchi > 0, ('nessuna versione espone crediti essenziali',versioni)
          print('Sapore di sale:',len(versioni),'versioni nella risposta; con crediti essenziali:',ricchi)
          print('Provenienza:',d.get('conteggioProvenienza'))
          print('In verifica:',d.get('inVerifica',d.get('nuoveInVerificaNelGiro',0)))
          PY

          echo "--- DIAGNOSTICA MOTORE ---"
          CODICE_DIAG=$(curl --silent --show-error --max-time 30 -o /tmp/diag.json -w '%{http_code}' \
            "$BASE/api/diagnostica?titolo=Sapore%20di%20sale&artista=Gino%20Paoli" || true)
          echo "HTTP diagnostica: $CODICE_DIAG"
          cat /tmp/diag.json || true
          echo
          test "$CODICE_DIAG" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/diag.json',encoding='utf-8'))
          assert d.get('stato') == 'pronto', d
          assert 'archivio' in d, d
          assert isinstance(d.get('provider'), list), d
          assert isinstance(d.get('fonti'), list), d
          assert isinstance(d.get('strategie'), list), d
          assert isinstance(d.get('prove'), list), d
          assert 'registaAI' in d, d
          for f in d.get('fonti') or []:
              assert 'haContribuitoAllArchivio' in f, f
          print('Diagnostica: provider',len(d.get('provider') or []),'fonti',len(d.get('fonti') or []),'prove',len(d.get('prove') or []))
          PY

          echo "COLLAUDO REMOTO LAB 0.8.0 COMPLETATO."
