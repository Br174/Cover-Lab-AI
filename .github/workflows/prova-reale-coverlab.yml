name: Prova reale temporanea Cover Lab AI

on:
  push:
    branches:
      - 'lab/uab-onboarding-01'
    paths:
      - '.github/workflows/prova-reale-coverlab.yml'

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica LAB 0.3.0 e paginazione Music Lab
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lab-uab-onboarding-01-cover-lab-ai.brunoverlezza.workers.dev"

          echo "Attendo la LAB 0.3.0..."
          PRONTA=0
          for TENTATIVO in $(seq 1 36); do
            CODICE_STATO=$(curl --silent --show-error --max-time 12 -o /tmp/stato.json -w '%{http_code}' "$BASE/" || true)
            if [ "$CODICE_STATO" = "200" ] && grep -q '"versione": "0.3.0"' /tmp/stato.json; then
              echo "Anteprima 0.3.0 pronta al tentativo $TENTATIVO."
              cat /tmp/stato.json
              echo
              PRONTA=1
              break
            fi
            echo "Tentativo $TENTATIVO: anteprima non ancora aggiornata (HTTP $CODICE_STATO)."
            sleep 5
          done
          test "$PRONTA" = "1"

          URL="$BASE/api/ricerca"
          INIZIO=$(date +%s%3N)
          CODICE=$(curl --silent --show-error --max-time 45 \
            -X POST "$URL" \
            -H 'content-type: application/json' \
            --data '{"titolo":"Sapore di sale","artista":"Gino Paoli","ordine":"asc","approfondisci":true}' \
            -o /tmp/risultato.json \
            -w '%{http_code}')
          FINE=$(date +%s%3N)
          DURATA=$((FINE-INIZIO))
          echo "Codice HTTP ricerca: $CODICE"
          echo "Durata totale ms: $DURATA"
          cat /tmp/risultato.json
          echo
          test "$CODICE" = "200"

          python - <<'PY'
          import json
          d=json.load(open('/tmp/risultato.json',encoding='utf-8'))
          print('--- RIASSUNTO RICERCA ---')
          print('stato:', d.get('stato'))
          print('provenienza:', d.get('provenienza'))
          print('versioniIndividuate:', d.get('versioniIndividuate'))
          print('durataMs motore:', d.get('durataMs'))
          c=d.get('composizione') or {}
          print('opera:', c.get('idMusicBrainz'), c.get('titolo'), c.get('anno'), c.get('lingua'))
          assert d.get('stato') == 'pronto', d
          assert c.get('idMusicBrainz') == 'e94fdfad-2d84-3cab-9152-3746a4c98162', c
          assert int(d.get('versioniIndividuate') or 0) > 0, d
          PY

          PAGINA="$BASE/api/versioni?titolo=Sapore%20di%20sale&artista=Gino%20Paoli&ordine=asc&offset=0"
          CODICE_PAGINA=$(curl --silent --show-error --max-time 20 -o /tmp/pagina.json -w '%{http_code}' "$PAGINA")
          echo "Codice HTTP pagina: $CODICE_PAGINA"
          cat /tmp/pagina.json
          echo
          test "$CODICE_PAGINA" = "200"

          python - <<'PY'
          import json
          d=json.load(open('/tmp/pagina.json',encoding='utf-8'))
          print('--- RIASSUNTO PAGINA MUSIC LAB ---')
          print('stato:', d.get('stato'))
          print('totale:', d.get('totale'))
          print('limite:', d.get('limite'))
          print('prossimoOffset:', d.get('prossimoOffset'))
          versioni=d.get('versioni') or []
          print('elementi pagina:', len(versioni))
          assert d.get('stato') == 'pronto', d
          assert d.get('limite') == 20, d
          assert len(versioni) <= 20, len(versioni)
          assert int(d.get('totale') or 0) >= len(versioni), d
          PY
