name: Verifica motore

# DORMANT_RESERVED since 2026-10-10: no automatic events; manual diagnostic only.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa dipendenze
        run: npm install
      - name: Esegui controlli automatici
        run: npm test
      - name: Valida pacchetto Cloudflare Worker
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
