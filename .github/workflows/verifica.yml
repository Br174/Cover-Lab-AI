name: UAB - Verifica motore Cover Lab AI

on:
  push:
    branches:
      - main
      - 'lab/**'
      - 'candidate/**'
      - 'mother/**'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa dipendenze
        run: npm install

      - name: Esegui controlli automatici del motore
        run: npm test

      - name: Valida pacchetto Cloudflare Worker
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
