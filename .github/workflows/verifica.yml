name: UAB - Verifica motore Cover Lab AI

on:
  push:
    branches:
      - main
      - 'lab/**'
      - 'candidate/**'
      - 'mother/**'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa dipendenze
        run: npm install

      - name: Esegui controlli automatici del motore
        run: npm test

      - name: Valida migrazione D1 localmente
        run: npx wrangler d1 migrations apply cover-lab-ai-db --local
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Valida pacchetto Cloudflare Worker
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Configura Java per Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compila APK diagnostico LAB
        working-directory: android
        run: gradle :app:assembleDebug
