name: UAB - Verifica motore Cover Lab AI

on:
  push:
    branches:
      - main
      - 'lab/**'
      - 'candidate/**'
      - 'mother/**'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa dipendenze
        run: npm install

      - name: Esegui controlli automatici del motore
        run: npm test

      - name: Valida pacchetto Cloudflare Worker
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Inizializza D1 tramite anteprima LAB
        if: github.event_name == 'push' && github.ref == 'refs/heads/lab/uab-onboarding-01'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://lab-uab-onboarding-01-cover-lab-ai.brunoverlezza.workers.dev/__inizializza-d1-cover-lab-ai"
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "$URL" -o /tmp/d1-risultato.json
          cat /tmp/d1-risultato.json
          grep -q '"stato": "ok"' /tmp/d1-risultato.json
          grep -q '"composizioni"' /tmp/d1-risultato.json
          grep -q '"versioni"' /tmp/d1-risultato.json
          grep -q '"fonti_verifica"' /tmp/d1-risultato.json
          grep -q '"ricerche"' /tmp/d1-risultato.json
          grep -q '"opere_collegate"' /tmp/d1-risultato.json
