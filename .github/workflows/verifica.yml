name: Verifica motore

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa dipendenze
        run: npm install
      - name: Esegui controlli automatici
        run: npm test
